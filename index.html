<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produse populare</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
  <style>
    body, .card {
      color: #936d37;
    }
    .btn-gold {
      color: #51391c;
      background-color: #d4b276;
      border-color: #c49b56;
    }
    .btn-gold:hover {
      color: #51391c;
      background-color: #c49b56;
    }
  </style>
</head>
<body class="p-3 text-center">
  <h1 class="mb-4">Produse populare</h1>

  <div class="container d-flex flex-wrap justify-content-around align-items-center gap-3 p-3 bg-light" style="max-width: 740px;">
    <div class="card p-3" style="width: 200px;">
      <img class="card-img-top object-fit-contain" src="images.jpg" alt="Pâine feliată" height="140">
      <h2 class="card-title fs-5 mt-3">Pâine</h2>
      <p class="fs-5 fw-bold">12 999 lei</p>
      <button type="button" class="btn btn-gold align-self-center">Plateste</button>
    </div>

    <div class="card p-3" style="width: 200px;">
      <img class="card-img-top object-fit-contain" src="images (1).jpg" alt="Parizer feliat" height="140">
      <h2 class="card-title fs-5 mt-3">Parizer</h2>
      <p class="fs-5 fw-bold">4500 lei</p>
      <button type="button" class="btn btn-gold align-self-center">Plateste</button>
    </div>

    <div class="card p-3" style="width: 200px;">
      <img class="card-img-top object-fit-contain" src="fundal.png" alt="Pachet Parliament" height="140">
      <h2 class="card-title fs-5 mt-3">Parliament</h2>
      <p class="fs-5 fw-bold">9 999 lei</p>
      <button type="button" class="btn btn-gold align-self-center">Plateste</button>
    </div>
  </div>
</body>
</html>
