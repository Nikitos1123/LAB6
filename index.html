<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produse populare</title>
  <link rel="stylesheet" href="bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="p-3 text-center">
  <h1 class="mb-4">Produse populare</h1>

  <div class="container magazin d-flex flex-row flex-wrap justify-content-around align-items-center gap-3 p-3">
    <div class="card produs p-3 rounded-3">
      <img class="card-img-top object-fit-contain" src="images.jpg" alt="Pâine feliată">
      <div class="card-body p-0 pt-3">
        <h2 class="card-title fs-5">Pâine</h2>
        <p class="card-text fs-5 fw-bold">12 999 lei</p>
        <button type="button" class="btn buton px-4">Plateste</button>
      </div>
    </div>

    <div class="card produs p-3 rounded-3">
      <img class="card-img-top object-fit-contain" src="images (1).jpg" alt="Parizer feliat">
      <div class="card-body p-0 pt-3">
        <h2 class="card-title fs-5">Parizer</h2>
        <p class="card-text fs-5 fw-bold">4500 lei</p>
        <button type="button" class="btn buton px-4">Plateste</button>
      </div>
    </div>

    <div class="card produs p-3 rounded-3">
      <img class="card-img-top object-fit-contain" src="fundal.png" alt="Pachet Parliament">
      <div class="card-body p-0 pt-3">
        <h2 class="card-title fs-5">Parliament</h2>
        <p class="card-text fs-5 fw-bold">9 999 lei</p>
        <button type="button" class="btn buton px-4">Plateste</button>
      </div>
    </div>
  </div>
</body>
</html>
